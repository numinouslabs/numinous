networks:
  validator_stage_network:
    name: validator_stage_network

services:
  if_validator_stage:
    container_name: if_validator_stage

    image: $AWS_ECR_REGISTRY/infinite_games:neuron-stage-latest

    pull_policy: always

    networks:
      - validator_stage_network

    volumes:
      - /root/validator-db-stage:/root/infinite_games/database
      - ./.bittensor:/root/.bittensor

    restart: unless-stopped

    environment:
      - INLINE_LOGS=1

    command: >
      bash -c "python neurons/validator.py --netuid 155 --subtensor.network test --wallet.name testkey --wallet.hotkey hkey2 --db.directory /root/infinite_games/database --logging.debug"

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  validator_network:
    name: validator_network

services:
  validator:
    container_name: numinous_validator

    image: numinouslabs/numinous:latest
    pull_policy: always

    platform: linux/amd64

    networks:
      - validator_network

    volumes:
      - ./validator-data/database:/root/infinite_games/database
      - ~/.bittensor:/root/.bittensor

    restart: unless-stopped

    environment:
      - INLINE_LOGS=1

    command: >
      bash -c "python neurons/validator.py --netuid 6 --subtensor.network finney --wallet.name ${WALLET_NAME} --wallet.hotkey ${WALLET_HOTKEY} --db.directory /root/infinite_games/database --numinous.env prod --logging.debug"

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
